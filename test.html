<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>API test</title>
    </head>
    <body>

        <button id="checkButton">Check API</button>
        <p id="output">Not checked yet.</p>

        <script>
            const button = document.querySelector("#checkButton");
            const output = document.querySelector("#output");

            button.addEventListener("click", async function () {
                output.textContent = "Checking...";

                try {
                    const response = await fetch("https://bank-of-evil.onrender.com/accounts/grufru/balance");
                    const data = await response.json();
                    console.log(data)
                    output.textContent = "Can" + (data.balance_cents/100).toFixed(2);
                } catch (error) {
                    output.textContent = "Could not reach the API.";
                }
            });
        </script>

        <h1>Bank</h1>
        <p class="bal">$0</p>
        <p class="bal">$100</p>
        <input id="user" placeholder="type here">
        <p id="a"></p>
        <p id="b"></p>
        <ul id="list"></ul>
        <script>
            const list = document.querySelector("#list");
            const item = document.createElement("li");
            item.textContent = "first row";
            list.appendChild(item);

            const ghost = document.createElement("lim");
            ghost.textContent = "not attached yet";
            list.appendChild(ghost);
        </script>

    </body>
</html>
